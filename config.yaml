  - {name: banksta,        category: markets, weight: 0}
  - {name: bbbreaking,     category: russia,  weight: 1}   # Раньше всех. Ну почти
  - {name: rbc_news,       category: russia,  weight: 1}
  - {name: tass_agency,    category: russia,  weight: 1}
  - {name: interfaxonline, category: russia,  weight: 1}
  - {name: rian_ru,        category: russia,  weight: 1}
  - {name: reyz_news,      category: markets, weight: 1}   # агрегатор срочных лент (Reuters, Интерфакс...)
  - {name: selfinvestor,   category: markets, weight: 0}   # Сам ты инвестор!
  - {name: antonchehovanalitk, category: markets, weight: 0}  # Аналитика от Чехова
  - {name: mindnews,       category: world,   weight: 0}   # Mind News (Украина)

# Группы ключевых слов: каждое найденное слово в заголовке даёт weight баллов,
# найденное только в тексте — половину.
# Внутри одной группы полный вес даёт только первое слово, остальные — по +1 балла.
keywords:
  urgent:
    weight: 6
    keywords: ['срочн', 'молни', 'экстренн', 'breaking', 'just in']

  russia_politics:
    weight: 3
    keywords: ['путин', 'кремл', 'пескова?\b', 'лавров', 'мишустин', 'госдум', 'совфед', 'указ\b', 'подписал\w* указ',
               'мобилизац', 'санкци', 'перегово', 'перемири', 'ядерн', 'нато\b', 'зеленск',
               'трамп', 'уиткофф', 'обмен пленн', 'военное положени']

  russia_economy:
    weight: 3
    keywords: ['ключев\w* ставк', 'ЦБ\b', 'банк\w* росси', 'набиуллин', 'инфляц', 'курс\w* рубл',
               'рубл\w* (укрепил|ослаб|обвал)', 'доллар', 'юан', 'мосбирж', 'индекс\w* мосбирж', 'imoex',
               'дивиденд', 'байбэк', 'обратн\w* выкуп', 'ipo\b', 'spo\b', 'делистинг', 'мсфо',
               'офз', 'дефицит\w* бюджет', 'ндс', 'налог\w* (повыш|реформ)', 'минфин',
               'сбер', 'газпром', 'лукойл', 'роснефт', 'новатэк', 'норникел', 'втб', 'яндекс',
               'татнефт', 'полюс', 'т-технолог', 'x5', 'магнит', 'алрос', 'северстал', 'русал']

  world_markets:
    weight: 3
    keywords: ['фрс', 'fed\b', 'federal reserve', 'пауэлл', 'powell', 'ецб', 'ecb\b', 'лагард',
               'rate (cut|hike)', 'interest rate', 'процентн\w* ставк', 'cpi\b', 'inflation',
               'payrolls', 'recession', 'рецесс', 's&p 500', 'nasdaq', 'dow jones', 'treasury',
               'цен\w* на нефт', 'нефт\w* (подорож|подешев|дорож|дешев)', 'oil price', 'brent', 'wti\b', 'opec', 'опек', 'золот', 'gold\b', 'tariff', 'пошлин',
               'дефолт', 'default',
               'nvidia', 'apple\b', 'tesla', 'microsoft', 'earnings', 'ipo\b']

  world_politics:
    weight: 3
    keywords: ['войн', 'war\b', 'ceasefire', 'invasion', 'вторжен', 'ракетн\w* удар', 'missile',
               'nuclear', 'переворот', 'coup\b', 'покушен', 'assassinat', 'impeach', 'импичмент',
               'отставк', 'resign', 'тайван', 'taiwan', 'иран', 'iran\b', 'израил', 'israel',
               'китай', 'china', 'си цзиньпин', 'xi jinping', 'sanction', 'nato\b', 'trump',
               'землетряс', 'earthquake', 'пандеми', 'pandemic', 'теракт', 'terror']

  crypto_major:
    weight: 3
    keywords: ['bitcoin', 'биткоин', 'btc\b', 'ethereum', 'эфириум', 'eth\b', 'etf\b', 'sec\b',
               'stablecoin', 'стейблкоин', 'tether', 'binance', 'coinbase', 'blackrock',
               'saylor', 'halving', 'халвинг', 'цифров\w* рубл', 'cbdc', 'майнинг', 'криптовалют']

  # Резкие события: сами по себе не считаются (boost), но сильно поднимают новость по теме.
  breaking:
    weight: 5
    boost: true
    keywords: ['мирн\w* (договор|соглашен|план)', 'peace (deal|agreement|treaty|plan)', 'перемири', 'ceasefire',
               'объявил\w* войн', 'declares? war', 'военн\w* положени', 'martial law', 'мобилизац',
               'ядерн\w* (удар|оружи|испытан)', 'nuclear (strike|test)', 'скончал', 'умер\b', 'dies\b', 'died\b',
               'убит', 'assassinat', 'покушен', 'арестова', 'arrested', 'отставк', 'resign', 'дефолт', 'default',
               'внеочередн', 'emergency', 'unscheduled', 'неожиданн', 'unexpected', 'surprise', 'впервые',
               'снят\w* санкц', 'снял\w* санкц', 'отмен\w* санкц', 'lift\w* sanctions', 'нов\w* санкц',
               'new sanctions', 'national emergency', 'переворот', 'coup\b', 'вторжен', 'invasion',
               'обвал', 'рухнул', 'crash', 'plunge', 'halt', 'приостанов']

  # Действия и события. Сами по себе ничего не дают (boost), но усиливают новость по теме:
  # "ЦБ" — 3 балла, "ЦБ повысил ставку" — уже 6+.
  actions:
    weight: 3
    boost: true
    keywords: ['повыс', 'пониз', 'снизил', 'сохранил', 'ввел', 'ввёл', 'введ', 'отмен', 'запрет',
               'одобр', 'подписал', 'утвердил', 'обвал', 'рухнул', 'взлетел', 'рекорд', 'взлом',
               'raise', 'hike', 'cut\b', 'cuts\b', 'approv', 'ban\b', 'bans\b', 'impose', 'crash',
               'plunge', 'soar', 'surge', 'record', 'all-time high', 'hack', 'exploit', 'collapse']

# Новость с этими словами отбрасывается сразу (шум).
blocklist: ['футбол', 'хоккей', 'теннис', 'матч', 'тренер', 'чемпионат', 'олимпи', 'актрис', 'актер',
            'певиц', 'певец', 'шоу\b', 'сериал', 'гороскоп', 'рецепт', 'погод', 'football', 'soccer',
            'tennis', 'nba\b', 'nfl\b', 'celebrity', 'recipe', 'horoscope', 'condo', 'oscar',
            # дайджесты и сводки: в них много ключевых слов сразу, но это не новость
            'главн\w* (новост|событ)', 'кратко', 'дайджест', 'итоги (дня|недели)', 'что произошло',
            'обзор (рынк|новост)', 'утренн\w* обзор', 'вечерн\w* обзор', 'morning briefing', 'what we know']

crypto:
  # Из крипто-лент берём только новости, где упомянуто хоть что-то из этого списка...
  required: ['bitcoin', 'биткоин', 'btc\b', 'ethereum', 'eth\b', 'etf\b', 'sec\b', 'stablecoin',
             'стейблкоин', 'blackrock', 'fed\b', 'фрс', 'regulat', 'регулир', 'congress', 'law\b']
  # ...и выкидываем мелкую крипту из любых лент.
  blocklist: ['memecoin', 'мемкоин', 'airdrop', 'аирдроп', 'presale', 'пресейл', 'ico\b', 'nft',
              'token unlock', 'pump\.fun', 'testnet', 'pepe', 'shib', 'altcoin', 'альткоин']
