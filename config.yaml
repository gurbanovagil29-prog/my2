# Настройки сканера новостей.
# Ключевые слова — регулярные выражения, сопоставляются с НАЧАЛА слова без учёта регистра.
# Поэтому достаточно писать основу: "санкци" поймает "санкции", "санкций", "санкционный".
# Точное слово: 'ЦБ\b'. Фразы: 'ключев\w* ставк'.

poll_interval: 30          # как часто опрашивать ленты, сек
max_age_minutes: 1440      # при запуске присылаем новости за последние 24 часа (уже отправленные — нет)
translate: true            # переводить иностранные заголовки на русский
db_path: scanner.db       # в Docker: data/scanner.db

# Одна и та же история из разных СМИ склеивается и приходит один раз (в каждый канал).
story:
  window_hours: 6
  similarity: 0.5          # 0..1, насколько похожи заголовки, чтобы считаться одной историей

# Каналы-получатели. Одна история может уйти в оба.
# chat_env — имя переменной окружения с id канала; если она не задана, используется CHAT_ID.
channels:
  feed:
    name: "📰 Лента"
    chat_env: CHAT_FEED
    mark: "🟡"
    min_score: 5                                   # всё интересное
    corroboration: {sources: 2, min_score: 4}      # или о теме пишут хотя бы 2 СМИ

  urgent:
    name: "⚡ Срочно"
    chat_env: CHAT_URGENT
    mark: "🔴"
    min_score: 9                                   # сильная новость по ключевым словам
    burst: {sources: 3, minutes: 30, min_score: 3} # или 3+ разных СМИ написали об этом за 30 минут
    max_delay_minutes: 30                          # срочное, пришедшее позже 30 мин, уже не срочное

categories:
  russia:  "🇷🇺 Россия"
  markets: "📈 Рынки"
  world:   "🌍 Мир"
  cbank:   "🏦 ЦБ"
  crypto:  "₿ Крипта"

# weight — базовые баллы источника (доверие/скорость), прибавляются к баллам ключевых слов.
sources:
  # --- Россия ---
  - {name: ТАСС,        url: "https://tass.ru/rss/v2.xml",                             category: russia,  weight: 1}
  - {name: Интерфакс,   url: "https://www.interfax.ru/rss",                            category: russia,  weight: 1}
  - {name: РИА,         url: "https://ria.ru/export/rss2/archive/index.xml",          category: russia,  weight: 1}
  - {name: РБК,         url: "https://rssexport.rbc.ru/rbcnews/news/30/full.rss",     category: russia,  weight: 1}
  - {name: Коммерсант,  url: "https://www.kommersant.ru/RSS/news.xml",                category: russia,  weight: 1}
  - {name: Ведомости,   url: "https://www.vedomosti.ru/rss/news",                     category: russia,  weight: 1}
  - {name: Meduza,      url: "https://meduza.io/rss/all",                             category: russia,  weight: 1}
  # --- Рынки ---
  - {name: Финам,       url: "https://www.finam.ru/analysis/conews/rsspoint/",        category: markets, weight: 1}
  - {name: Smart-lab,   url: "https://smart-lab.ru/news/rss/",                        category: markets, weight: 1}
  - {name: Investing RU, url: "https://ru.investing.com/rss/news.rss",                category: markets, weight: 1}
  - {name: Investing,   url: "https://www.investing.com/rss/news.rss",                category: markets, weight: 1}
  - {name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", category: markets, weight: 1}
  # --- Центробанки и регуляторы: редкие, но важные публикации ---
  - {name: ЦБ РФ,       url: "https://www.cbr.ru/rss/eventrss",                       category: cbank,   weight: 2}
  - {name: ФРС,         url: "https://www.federalreserve.gov/feeds/press_all.xml",    category: cbank,   weight: 2}
  - {name: ЕЦБ,         url: "https://www.ecb.europa.eu/rss/press.html",              category: cbank,   weight: 2}
  - {name: SEC,         url: "https://www.sec.gov/news/pressreleases.rss",            category: cbank,   weight: 0}
  # --- Мир ---
  - {name: BBC,         url: "https://feeds.bbci.co.uk/news/world/rss.xml",           category: world,   weight: 1}
  - {name: FT,          url: "https://www.ft.com/rss/home",                           category: world,   weight: 1}
  - {name: NYT,         url: "https://rss.nytimes.com/services/xml/rss/nyt/World.xml", category: world,  weight: 1}
  - {name: Guardian,    url: "https://www.theguardian.com/world/rss",                 category: world,   weight: 0}
  - {name: Al Jazeera,  url: "https://www.aljazeera.com/xml/rss/all.xml",             category: world,   weight: 0}
  # --- Крипта (только крупное, см. блок crypto ниже) ---
